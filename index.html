    <title>Wrapbox</title>
    <script>
      // The live prototype runs the desktop design system + shell in both themes (the
      // decks, demo and video load tour.html, which keeps the original shell).
      document.documentElement.dataset.ds = "desktop";
      // Light is the default; apply a saved dark choice before first paint.
      try {
        // ?theme=light|dark sets the saved choice (used by the portfolio screenshot capture).
        var q = new URLSearchParams(location.search).get("theme");
        if (q === "dark") localStorage.setItem("wrapbox-theme", "dark");
        if (q === "light") localStorage.removeItem("wrapbox-theme");
        document.documentElement.dataset.theme = localStorage.getItem("wrapbox-theme") === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
